<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="355" viewBox="0 0 1120 355" role="img" aria-labelledby="title desc"><title id="title">用户自定义 USB 串口</title><desc id="desc">用户自定义 USB 串口；功能示意</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6d8caf"/></marker></defs><rect width="1120" height="355" rx="18" fill="#f2f6fc"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif"><text x="32" y="45" font-size="26" fill="#193451" font-weight="700" text-anchor="start">用户自定义 USB 串口</text><text x="1085" y="44" font-size="13" fill="#546b84" font-weight="400" text-anchor="end">功能示意</text><rect x="32" y="125" width="290" height="180" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="54" y="162" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">相机用户程序</text><text x="54" y="197" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">/dev/ttyGS2</text><text x="54" y="226" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">自定义字节协议</text><rect x="415" y="125" width="290" height="180" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="437" y="162" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">USB ACM</text><text x="437" y="197" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">电脑识别为 COM 口</text><text x="437" y="226" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">与 SDK 数据通道独立</text><rect x="798" y="125" width="290" height="180" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="820" y="162" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">电脑用户程序</text><text x="820" y="197" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">串口工具或自写应用</text><text x="820" y="226" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">处理拆包与粘包</text><path d="M322 215 L409 215" fill="none" stroke="#6d8caf" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M705 215 L792 215" fill="none" stroke="#6d8caf" stroke-width="2.6" marker-end="url(#arrow)"/></g></svg>
