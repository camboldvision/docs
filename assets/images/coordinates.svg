<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="435" viewBox="0 0 1120 435" role="img" aria-labelledby="title desc"><title id="title">深度点的坐标方向</title><desc id="desc">深度点的坐标方向；三维坐标示意</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6d8caf"/></marker></defs><rect width="1120" height="435" rx="18" fill="#f2f6fc"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif"><text x="32" y="45" font-size="26" fill="#193451" font-weight="700" text-anchor="start">深度点的坐标方向</text><text x="1085" y="44" font-size="13" fill="#546b84" font-weight="400" text-anchor="end">三维坐标示意</text><rect x="50" y="100" width="480" height="290" rx="14" fill="#ffffff" stroke="#cbd9eb"/><circle cx="180" cy="242" r="30" fill="#e6efff" stroke="#2563eb" stroke-width="3"/><circle cx="180" cy="242" r="13.5" fill="#2563eb"/><path d="M180 242 L426 242" fill="none" stroke="#cf4545" stroke-width="2.6" marker-end="url(#arrow)"/><text x="420" y="224" font-size="22" fill="#b23030" font-weight="600" text-anchor="middle">+X 向右</text><path d="M180 242 L180 356" fill="none" stroke="#30865a" stroke-width="2.6" marker-end="url(#arrow)"/><text x="203" y="353" font-size="22" fill="#23764c" font-weight="600" text-anchor="start">+Y 向下</text><path d="M180 242 L325 136" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrow)"/><text x="353" y="144" font-size="22" fill="#2563eb" font-weight="600" text-anchor="start">+Z 向前</text><rect x="575" y="100" width="510" height="290" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="597" y="137" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">校正左相机光学坐标</text><text x="597" y="172" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">XYZ 单位：米</text><text x="597" y="201" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">像素原点：左上角，u 向右、v 向下</text><text x="597" y="230" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">SLAM 位姿使用地图坐标</text><text x="597" y="259" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">投到地图前需应用坐标关系</text></g></svg>
