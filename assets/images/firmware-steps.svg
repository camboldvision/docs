<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="370" viewBox="0 0 1120 370" role="img" aria-labelledby="title desc"><title id="title">固件升级流程</title><desc id="desc">固件升级流程；功能示意</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6d8caf"/></marker></defs><rect width="1120" height="370" rx="18" fill="#f2f6fc"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif"><text x="32" y="45" font-size="26" fill="#193451" font-weight="700" text-anchor="start">固件升级流程</text><text x="1085" y="44" font-size="13" fill="#546b84" font-weight="400" text-anchor="end">功能示意</text><rect x="32" y="110" width="225" height="150" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="54" y="147" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">1 备份</text><text x="54" y="182" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">地图与用户文件</text><text x="54" y="211" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">标定与配置</text><rect x="307" y="110" width="225" height="150" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="329" y="147" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">2 进入 Loader</text><text x="329" y="182" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">终端执行</text><text x="329" y="211" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">sudo reboot loader</text><rect x="582" y="110" width="225" height="150" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="604" y="147" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">3 烧录</text><text x="604" y="182" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">RKDevTool</text><text x="604" y="211" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">选择匹配固件</text><rect x="857" y="110" width="231" height="150" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="879" y="147" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">4 重启确认</text><text x="879" y="182" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">等待自动重启</text><text x="879" y="211" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">Viewer 检查功能</text><path d="M257 185 L301 185" fill="none" stroke="#6d8caf" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M532 185 L576 185" fill="none" stroke="#6d8caf" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M807 185 L851 185" fill="none" stroke="#6d8caf" stroke-width="2.6" marker-end="url(#arrow)"/><text x="560" y="325" font-size="19" fill="#546b84" font-weight="400" text-anchor="middle">先安装 Rockchip Windows 驱动 · 烧录中保持稳定供电与 USB 连接</text></g></svg>
