<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc"><title id="title">选择相机的放置方向</title><desc id="desc">选择相机的放置方向；功能示意</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6d8caf"/></marker></defs><rect width="1120" height="450" rx="18" fill="#f2f6fc"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif"><text x="32" y="45" font-size="26" fill="#193451" font-weight="700" text-anchor="start">选择相机的放置方向</text><text x="1085" y="44" font-size="13" fill="#546b84" font-weight="400" text-anchor="end">功能示意</text><rect x="32" y="100" width="505" height="310" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="54" y="137" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">水平 · 针孔投影</text><text x="54" y="172" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">相机左右排列</text><text x="54" y="201" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">设置水平焦距（像素）</text><rect x="135" y="250" width="295" height="97" rx="14" fill="#edf4ff" stroke="#cbd9eb"/><circle cx="210" cy="298" r="23" fill="#e6efff" stroke="#2563eb" stroke-width="3"/><circle cx="210" cy="298" r="10.35" fill="#2563eb"/><circle cx="355" cy="298" r="23" fill="#e6efff" stroke="#2563eb" stroke-width="3"/><circle cx="355" cy="298" r="10.35" fill="#2563eb"/><text x="210" y="385" font-size="17" fill="#546b84" font-weight="400" text-anchor="middle">左</text><text x="355" y="385" font-size="17" fill="#546b84" font-weight="400" text-anchor="middle">右</text><rect x="563" y="100" width="525" height="310" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="585" y="137" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">垂直 · 圆柱投影</text><text x="585" y="172" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">左相机在上，右相机在下</text><text x="585" y="201" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">设置水平焦距和垂直 FOV</text><rect x="635" y="235" width="100" height="155" rx="14" fill="#edf4ff" stroke="#cbd9eb"/><circle cx="685" cy="272" r="21" fill="#e6efff" stroke="#2563eb" stroke-width="3"/><circle cx="685" cy="272" r="9.450000000000001" fill="#2563eb"/><circle cx="685" cy="351" r="21" fill="#e6efff" stroke="#2563eb" stroke-width="3"/><circle cx="685" cy="351" r="9.450000000000001" fill="#2563eb"/><text x="756" y="279" font-size="18" fill="#193451" font-weight="400" text-anchor="start">左相机</text><text x="756" y="358" font-size="18" fill="#193451" font-weight="400" text-anchor="start">右相机</text><text x="850" y="312" font-size="18" fill="#2563eb" font-weight="400" text-anchor="start">预览旋转 90°</text></g></svg>
