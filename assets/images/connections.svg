<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc"><title id="title">连接相机与电脑</title><desc id="desc">连接相机与电脑；功能示意</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6d8caf"/></marker></defs><rect width="1120" height="440" rx="18" fill="#f2f6fc"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif"><text x="32" y="45" font-size="26" fill="#193451" font-weight="700" text-anchor="start">连接相机与电脑</text><text x="1085" y="44" font-size="13" fill="#546b84" font-weight="400" text-anchor="end">功能示意</text><rect x="32" y="110" width="275" height="240" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="54" y="147" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">CamBold 相机</text><text x="54" y="182" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">Type-C 接电脑</text><text x="54" y="211" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">可同时接独立 5 V 电源</text><rect x="407" y="110" width="310" height="240" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="429" y="147" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">一根 USB 数据线</text><text x="429" y="182" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">UVC：双目图像</text><text x="429" y="211" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">SDK：数据与终端</text><text x="429" y="240" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">MTP：共享文件</text><text x="429" y="269" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">ACM：用户通信</text><rect x="817" y="110" width="271" height="240" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="839" y="147" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">电脑</text><text x="839" y="182" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">Windows / Linux / macOS</text><text x="839" y="211" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">Viewer 或用户应用</text><path d="M307 230 L401 230" fill="none" stroke="#6d8caf" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M717 230 L811 230" fill="none" stroke="#6d8caf" stroke-width="2.6" marker-end="url(#arrow)"/><text x="560" y="400" font-size="19" fill="#546b84" font-weight="400" text-anchor="middle">USB 2.0 / 3.x 线材均可 · 当前固件使用 USB 2.0 High-Speed</text></g></svg>
