<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="395" viewBox="0 0 1120 395" role="img" aria-labelledby="title desc"><title id="title">用源时间戳关联数据</title><desc id="desc">用源时间戳关联数据；功能示意</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6d8caf"/></marker></defs><rect width="1120" height="395" rx="18" fill="#f2f6fc"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif"><text x="32" y="45" font-size="26" fill="#193451" font-weight="700" text-anchor="start">用源时间戳关联数据</text><text x="1085" y="44" font-size="13" fill="#546b84" font-weight="400" text-anchor="end">功能示意</text><rect x="32" y="100" width="290" height="190" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="54" y="137" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">相机采集时刻 t</text><text x="54" y="172" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">原图时间：曝光中点</text><text x="54" y="201" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">IMU：各自采样时刻</text><rect x="410" y="100" width="300" height="190" rx="14" fill="#e8f0ff" stroke="#cbd9eb"/><text x="432" y="137" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">深度与颜色</text><text x="432" y="172" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">保留源图时间 t</text><text x="432" y="201" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">完成时刻不会替代 t</text><rect x="800" y="100" width="288" height="190" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="822" y="137" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">电脑接收时刻</text><text x="822" y="172" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">含 USB / 调度等待</text><text x="822" y="201" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">不能替代采集时刻</text><path d="M322 195 L404 195" fill="none" stroke="#6d8caf" stroke-width="2.6" marker-end="