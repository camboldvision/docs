<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc"><title id="title">选择地图运行方式</title><desc id="desc">选择地图运行方式；功能示意</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6d8caf"/></marker></defs><rect width="1120" height="430" rx="18" fill="#f2f6fc"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif"><text x="32" y="45" font-size="26" fill="#193451" font-weight="700" text-anchor="start">选择地图运行方式</text><text x="1085" y="44" font-size="13" fill="#546b84" font-weight="400" text-anchor="end">功能示意</text><rect x="32" y="105" width="320" height="220" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="54" y="142" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">重新建图</text><text x="54" y="177" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">输入地图名称</text><text x="54" y="206" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">创建新地图</text><text x="54" y="235" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">停止时保存</text><rect x="400" y="105" width="320" height="220" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="422" y="142" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">继续建图</text><text x="422" y="177" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">选择已有地图</text><text x="422" y="206" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">定位并扩展地图</text><text x="422" y="235" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">停止时保存更新</text><rect x="768" y="105" width="320" height="220" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="790" y="142" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">纯定位</text><text x="790" y="177" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">选择已有地图</text><text x="790" y="206"