<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="435" viewBox="0 0 1120 435" role="img" aria-labelledby="title desc"><title id="title">从配对颜色与视差生成三维点</title><desc id="desc">从配对颜色与视差生成三维点；功能示意</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6d8caf"/></marker></defs><rect width="1120" height="435" rx="18" fill="#f2f6fc"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif"><text x="32" y="45" font-size="26" fill="#193451" font-weight="700" text-anchor="start">从配对颜色与视差生成三维点</text><text x="1085" y="44" font-size="13" fill="#546b84" font-weight="400" text-anchor="end">功能示意</text><rect x="32" y="115" width="270" height="210" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="54" y="152" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">同一时刻的两平面</text><text x="54" y="187" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">校正左图 · RGB565</text><text x="54" y="216" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">视差 · FP16</text><text x="54" y="245" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">相同宽高和时间戳</text><rect x="410" y="115" width="300" height="210" rx="14" fill="#e8f0ff" stroke="#cbd9eb"/><text x="432" y="152" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">SDK 三维接口</text><text x="432" y="187" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">cb_disparity_to_point</text><text x="432" y="216" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">按帧元数据处理投影</text><text x="432" y="245" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">输出 XYZ，单位米</text><rect x="817" y="115" width="271" height="210" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="839" y="152" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">用户应用</text><text x="839" y="187" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">测距与空间检测</text><text x="839" y="216" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">三维彩色点云</text><text x="839" y="245" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">用户业务处理</text><path d="M302 220 L404 220" fill="none" stroke="#6d8caf" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M710 220 L811 220" fill="none" stroke="#6d8caf" stroke-width="2.6" marker-end="url(#arrow)"/><text x="560" y="390" font-size="19" fill="#546b84" font-weight="400" text-anchor="middle">颜色与视差逐像素对应 · 黑色无效区不产生有效三维点</text></g></svg>
