<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc"><title id="title">SDK 应用调用顺序</title><desc id="desc">SDK 应用调用顺序；功能示意</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6d8caf"/></marker></defs><rect width="1120" height="400" rx="18" fill="#f2f6fc"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif"><text x="32" y="45" font-size="26" fill="#193451" font-weight="700" text-anchor="start">SDK 应用调用顺序</text><text x="1085" y="44" font-size="13" fill="#546b84" font-weight="400" text-anchor="end">功能示意</text><rect x="32" y="110" width="225" height="180" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="54" y="147" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">打开与连接</text><text x="54" y="182" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">cb_open</text><text x="54" y="211" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">等待连接</text><rect x="307" y="110" width="225" height="180" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="329" y="147" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">能力与配置</text><text x="329" y="182" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">读实际状态</text><text x="329" y="211" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">等待执行结果</text><rect x="582" y="110" width="225" height="180" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="604" y="147" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">接收与处理</text><text x="604" y="182" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">回调快速入队</text><text x="604" y="211" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">应用线程处理</text><rect x="857" y="110" width="231" height="180" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="879" y="147" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">结束与释放</text><text x="879" y="182" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">停止用户线程</text><text x="879" y="211" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">关闭视频与 SDK</text><path d="M257 200 L301 200" fill="none" stroke="#6d8caf" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M532 200 L576 200" fill="none" stroke="#6d8caf" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M807 200 L851 200" fill="none" stroke="#6d8caf" stroke-width="2.6" marker-end="url(#arrow)"/><text x="560" y="355" font-size="20" fill="#193451" font-weight="500" text-anchor="middle">控制返回 0 表示请求已排队；设备执行结果异步返回</text></g></svg>
