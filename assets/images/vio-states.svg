<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc"><title id="title">从连接到有效位姿</title><desc id="desc">从连接到有效位姿；功能示意</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6d8caf"/></marker></defs><rect width="1120" height="400" rx="18" fill="#f2f6fc"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif"><text x="32" y="45" font-size="26" fill="#193451" font-weight="700" text-anchor="start">从连接到有效位姿</text><text x="1085" y="44" font-size="13" fill="#546b84" font-weight="400" text-anchor="end">功能示意</text><rect x="32" y="110" width="245" height="180" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="54" y="147" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">设备已连接</text><text x="54" y="182" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">读取能力与配置</text><text x="54" y="211" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">等待启动指令</text><rect x="327" y="110" width="235" height="180" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="349" y="147" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">初始化</text><text x="349" y="182" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">输入准备就绪</text><text x="349" y="211" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">建立运动状态</text><rect x="612" y="110" width="235" height="180" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="634" y="147" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">地图对齐</text><text x="634" y="182" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">加载地图时需要</text><text x="634" y="211" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">观察已记录区域</text><rect x="897" y="110" width="191" height="180" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="919" y="147" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">有效位姿</text><text x="919" y="182" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">200 Hz 更新</text><text x="919" y="211" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">检查源时间</text><path d="M277 200 L321 200" fill="none" stroke="#6d8caf" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M562 200 L606 200" fill="none" stroke="#6d8caf" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M847 200 L891 200" fill="none" stroke="#6d8caf" stroke-width="2.6" marker-end="url(#arrow)"/><text x="560" y="355" font-size="19" fill="#546b84" font-weight="400" text-anchor="middle">新建图使用新地图坐标；继续建图 / 纯定位需对齐已有地图</text></g></svg>
