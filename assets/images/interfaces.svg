<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc"><title id="title">扩展接口与 Linux 入口</title><desc id="desc">扩展接口与 Linux 入口；信号分组示意</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6d8caf"/></marker></defs><rect width="1120" height="450" rx="18" fill="#f2f6fc"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif"><text x="32" y="45" font-size="26" fill="#193451" font-weight="700" text-anchor="start">扩展接口与 Linux 入口</text><text x="1085" y="44" font-size="13" fill="#546b84" font-weight="400" text-anchor="end">信号分组示意</text><rect x="32" y="105" width="330" height="240" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="54" y="142" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">GH1.25 · 10P</text><text x="54" y="177" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">5 V / GND：电源</text><text x="54" y="206" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">CAN_H / CAN_L</text><text x="54" y="235" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">UART TX / RX</text><text x="54" y="264" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">I²C SCL / SDA</text><rect x="454" y="105" width="290" height="105" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="476" y="142" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">CAN 总线</text><text x="476" y="177" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">Linux：can0</text><rect x="454" y="240" width="290" height="105" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="476" y="277" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">UART 串口</text><text x="476" y="312" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">Linux：/dev/ttyS2</text><rect x="800" y="105" width="288" height="240" rx="14" fill="#fff" stroke="#cbd9eb"/><text x="822" y="142" font-size="21" fill="#2563eb" font-weight="700" text-anchor="start">I²C 外设</text><text x="822" y="177" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">Linux：/dev/i2c-2</text><text x="822" y="206" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">当前板上拉至 1.8 V</text><text x="822" y="235" font-size="17" fill="#546b84" font-weight="400" text-anchor="start">按外设手册访问</text><text x="560" y="405" font-size="20" fill="#193451" font-weight="500" text-anchor="middle">先核对引脚、电平和公共地 · 电源输入仅支持 5 V</text></g></svg>
